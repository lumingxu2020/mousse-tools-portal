<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>慕斯的小工具</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div class="layout"><aside><a class="brand" href="/"><img src="/favicon.svg" width="40" height="40" alt=""><span>慕斯<span class="brand-sub">的小工具</span></span></a><div class="nav-label">我的工具箱</div><nav id="categories" aria-label="应用分类"><button data-category="全部" class="selected">▦ <span>全部应用</span><b></b></button><button data-category="学习">✎ <span>学习</span><b></b></button><button data-category="工作">▤ <span>工作</span><b></b></button><button data-category="生活">♡ <span>生活</span><b></b></button></nav><div class="aside-bottom"><span class="small">NAS 上的家庭工具箱</span><button id="manage" class="manage-button">⚙ 管理应用</button></div></aside>
<main><header><span class="breadcrumb">我的空间 <span>/</span> 应用导航</span><div class="network"><label for="network">访问方式</label><select id="network"><option value="local">内网</option><option value="external">外网</option></select></div></header><section class="intro"><div><div class="eyebrow">MOUSSE’S TOOLBOX</div><h1 id="title">慕斯的小工具</h1><p>学习有进步，工作更轻松，生活多一点乐趣。</p></div><div class="total"><strong id="total">—</strong><span>个常用应用</span></div></section><div class="tools"><h2 id="sectionTitle">全部应用</h2><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索应用…" aria-label="搜索应用"></label></div><div id="groups" aria-live="polite"><p>正在加载工具箱…</p></div><footer><span>每个小工具，都是生活的一点小帮手。</span><span>慕斯 · 家庭工具箱</span></footer></main></div>
<dialog id="loginDialog"><form id="loginForm"><div class="dialog-head"><h2>进入管理</h2><button type="button" class="close" data-close="loginDialog" aria-label="关闭">×</button></div><p class="muted">输入管理密码，添加和整理工具箱中的应用。</p><label>管理密码<input type="password" name="password" autocomplete="current-password" required></label><p class="error" id="loginError" role="alert"></p><button class="primary" type="submit">登录管理</button></form></dialog>
<dialog id="adminDialog" class="wide"><div class="dialog-head"><div><span class="eyebrow">工具箱设置</span><h2>管理应用</h2></div><button type="button" class="close" data-close="adminDialog" aria-label="关闭">×</button></div><p class="muted">修改立即保存到 NAS；移除卡片不会卸载应用。</p><div class="admin-actions"><button class="primary" id="addApp">＋ 添加应用</button><button id="exportConfig">导出配置</button><button id="importConfig">导入配置</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="passwordButton">修改密码</button><button id="logout">退出管理</button></div><div id="adminList"></div><p class="error" id="adminError" role="alert"></p></dialog>
<dialog id="editDialog"><form id="editForm"><div class="dialog-head"><h2 id="editTitle">添加应用</h2><button class="close" type="button" data-close="editDialog" aria-label="关闭">×</button></div><label>应用名称<input name="name" maxlength="40" required placeholder="例如：阅读记录"></label><div class="two"><label>分类<select name="category"><option>学习</option><option>工作</option><option>生活</option></select></label><label>图标（表情符号）<input name="icon" maxlength="12" required placeholder="📚"></label></div><label>简介<textarea name="description" maxlength="160" required rows="2" placeholder="一句话介绍这个工具"></textarea></label><label>内网地址<input name="url" type="url" required placeholder="http://192.168.50.251:端口/"></label><label>外网地址（选填）<input name="externalUrl" type="url" placeholder="https://你的应用域名/"></label><label class="check"><input name="visible" type="checkbox" checked>在首页显示</label><p class="error" id="editError" role="alert"></p><div class="form-actions"><button type="button" data-close="editDialog">取消</button><button class="primary" type="submit">保存应用</button></div></form></dialog>
<dialog id="passwordDialog"><form id="passwordForm"><div class="dialog-head"><h2>修改管理密码</h2><button class="close" type="button" data-close="passwordDialog" aria-label="关闭">×</button></div><label>当前密码<input name="current" type="password" autocomplete="current-password" required></label><label>新密码（至少 10 位）<input name="next" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p class="error" id="passwordError" role="alert"></p><button class="primary">保存密码</button></form></dialog><div id="toast" role="status" hidden></div></body></html>
